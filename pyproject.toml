[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "postwire"
version = "0.1.0"
description = "Transactional event bus on Postgres: outbox + pub/sub fan-out + partition-key ordering."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.40",
    "asyncpg>=0.30",
    "pydantic>=2.10",
    "structlog>=25.0",
    "alembic>=1.16",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "ruff>=0.13",
    "ty>=0.0.30",
    "pre-commit>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/postwire"]

[tool.hatch.build.targets.sdist]
include = ["src/postwire", "alembic", "alembic.ini", "README.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "scripts", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]
